.crow-crest{transform-origin:122px 68px;animation:jambul 4s ease-in-out infinite}
.crow-eyes{transform-origin:120px 137px;animation:kedip 4.6s infinite}
.crow-happy{opacity:0}
@keyframes napas{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
@keyframes lambai{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(10deg)}}
@keyframes pudar{0%,100%{opacity:0}50%{opacity:1}}
