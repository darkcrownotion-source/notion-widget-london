<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Course Hub · Darkcrow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400..700&family=Noto+Naskh+Arabic:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#ffffff;--surface:#fafafa;--control:#f4f4f4;
  --line:#e7e7e8;--line-2:#d8d8da;
  --ink:#1c1c1e;--ink-2:#3f3f43;--muted:#636367;
  --button:#232325;--button-h:#424245;--button-ink:#ffffff;
  --dark:#1c1c1e;--dark-2:#111113;--dark-line:#2e2e31;--dark-ink:#f4f4f5;--dark-muted:#8f8f94;
  --accent:#e5484d;--accent-strong:#c8372d;--accent-soft:#fdeeed;--violet:#7c5cff;
  --sig:linear-gradient(90deg,#e5484d 0%,#e5484d 55%,#7c5cff 100%);
  --h0:#efeff0;--h1:#cfcfd2;--h2:#9c9ca1;--h3:#5d5d62;--h4:#1c1c1e;
  --shadow:0 12px 28px -18px rgba(0,0,0,.24);
  --serif:"Instrument Serif",Georgia,serif;
  --sans:"Inter Variable",Inter,Arial,sans-serif;
  --r-button:10px;--r-card:14px;--r-panel:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#191919;--surface:#202022;--control:#2a2a2d;
    --line:#2e2e31;--line-2:#3a3a3e;
    --ink:#f2f2f3;--ink-2:#c9c9cd;--muted:#8f8f94;
    --button:#f2f2f3;--button-h:#d8d8db;--button-ink:#111113;
    --dark:#232325;--dark-2:#1c1c1e;--dark-line:#34343a;
    --accent-soft:rgba(229,72,77,.16);
    --h0:#262628;--h1:#3d3d41;--h2:#66666c;--h3:#a3a3a8;--h4:#f2f2f3;
    --shadow:0 12px 28px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#191919;--surface:#202022;--control:#2a2a2d;
  --line:#2e2e31;--line-2:#3a3a3e;
  --ink:#f2f2f3;--ink-2:#c9c9cd;--muted:#8f8f94;
  --button:#f2f2f3;--button-h:#d8d8db;--button-ink:#111113;
  --dark:#232325;--dark-2:#1c1c1e;--dark-line:#34343a;
  --accent-soft:rgba(229,72,77,.16);
  --h0:#262628;--h1:#3d3d41;--h2:#66666c;--h3:#a3a3a8;--h4:#f2f2f3;
  --shadow:0 12px 28px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--canvas);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 28px}

/* header */
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top h1{font:400 34px/1.05 var(--serif);margin:0;letter-spacing:-.01em;flex:1;min-width:0;overflow-wrap:anywhere}
.top h1 em{font-style:italic}
.pill{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.dot.off{background:var(--line-2)}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:var(--canvas);border-radius:var(--r-button);flex:none}
.icon-btn:hover{background:var(--control)}
.icon-btn svg{width:17px;height:17px}

/* continue */
.lanjut{position:relative;overflow:hidden;background:var(--dark);color:var(--dark-ink);border-radius:var(--r-panel);padding:20px 20px 18px;margin-bottom:16px}
.lanjut::before{content:"";position:absolute;right:-60px;top:-70px;width:240px;height:200px;background:radial-gradient(closest-side,rgba(124,92,255,.22),transparent),radial-gradient(closest-side at 30% 70%,rgba(229,72,77,.14),transparent);filter:blur(24px);pointer-events:none}
.lanjut::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);background-size:14px 14px;pointer-events:none}
.lanjut>*{position:relative;z-index:1}
.eyebrow{font-size:13px;color:var(--dark-muted);display:flex;align-items:center;gap:8px}
.lanjut h2{font:400 28px/1.15 var(--serif);margin:6px 0 2px;overflow-wrap:anywhere}
.lanjut .sub{color:var(--dark-muted);font-size:14px}
.scribble{display:block;width:72px;height:3px;border-radius:3px;background:var(--sig);margin:10px 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:var(--r-button);border:1px solid var(--line-2);background:var(--canvas);font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--control)}
.btn.primary{background:var(--button);border-color:var(--button);color:var(--button-ink)}
.btn.primary:hover{background:var(--button-h)}
.btn.sm{height:32px;padding:0 11px;font-size:13px}
.btn svg{width:15px;height:15px}
.lanjut .btn{background:transparent;border-color:var(--dark-line);color:var(--dark-ink)}
.lanjut .btn:hover{background:rgba(255,255,255,.06)}
.lanjut .btn.primary{background:#fff;border-color:#fff;color:#111113}
.lanjut .btn.primary:hover{background:#e9e9ea}

/* grid */
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:640px){.grid{grid-template-columns:minmax(0,1.4fr) minmax(250px,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{border:1px solid var(--line);border-radius:var(--r-card);background:var(--canvas)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
.card-h h3{margin:0;font-size:14px;font-weight:600}
.card-b{padding:12px 16px 16px}
.label{font-size:13px;color:var(--muted)}

/* materials */
.mat{border:1px solid var(--line);border-radius:var(--r-card);background:var(--canvas);overflow:hidden}
.mat-h{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;background:none;border:0;text-align:left}
.mat-h:hover{background:var(--surface)}
.ring{width:38px;height:38px;flex:none;position:relative}
.ring svg{width:38px;height:38px;transform:rotate(-90deg)}
.ring .t{stroke:var(--line)}
.ring .p{stroke:var(--ink);transition:stroke-dashoffset .5s cubic-bezier(.2,.7,.2,1)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.ring.full .c{color:#fff}
.ring.full .c::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--accent-strong)}
.ring.full .c span{position:relative}
.mat-name{flex:1;min-width:0}
.mat-name b{display:block;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.mat-name small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.chev{width:16px;height:16px;color:var(--muted);transition:transform .2s}
.mat.open .chev{transform:rotate(180deg)}
.bab-list{display:none;border-top:1px solid var(--line);padding:4px 0;background:var(--surface)}
.mat.open .bab-list{display:block}
.bab{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 12px;min-height:40px}
.bab.now{box-shadow:inset 2px 0 0 var(--accent)}
.chk{width:22px;height:22px;flex:none;border-radius:7px;border:1px solid var(--line-2);background:var(--canvas);display:grid;place-items:center;padding:0}
.chk svg{width:13px;height:13px;opacity:0;color:#fff}
.chk.on{background:var(--accent-strong);border-color:var(--accent-strong)}
.chk.on svg{opacity:1}
.chk.pop{animation:pop .32s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.bab-name{flex:1;min-width:0;font-size:14px;color:var(--ink);text-decoration:none;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left}
a.bab-name:hover{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.bab.done .bab-name{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(229,72,77,.55)}
.mini{height:28px;padding:0 9px;border-radius:8px;border:1px solid transparent;background:none;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;flex:none}
.mini:hover{border-color:var(--line-2);color:var(--ink);background:var(--canvas)}
.mini svg{width:13px;height:13px}
.bab-txt{flex:1;min-width:0;display:flex;flex-direction:column}.bab-txt .from{font-size:12px;color:var(--muted)}
.mini.on{color:var(--ink);border-color:var(--line-2);background:var(--canvas)}.mini.on svg{color:var(--accent-strong)}
.plan-list .bab{padding-left:16px;padding-right:12px}
.sg{list-style:none;counter-reset:s;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.sg li{counter-increment:s;display:flex;flex-direction:column;padding:8px 10px 8px 36px;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.sg li::before{content:counter(s);position:absolute;left:12px;top:9px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sg b{font-weight:500;font-size:14px}.sg small{font-size:12px;color:var(--muted)}
.stats3 b small{font-size:12px;font-weight:400;color:var(--muted)}
.mat-link{display:flex;justify-content:flex-end;padding:4px 12px 8px}

/* timer */
.tabs{display:inline-flex;background:var(--control);border-radius:var(--r-button);padding:3px;gap:2px}
.tabs button{height:28px;padding:0 11px;border:0;border-radius:8px;background:none;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--canvas);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.clock{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px}
.dial{position:relative;width:176px;height:176px}
.dial svg{width:176px;height:176px;transform:rotate(-90deg)}
.dial .t{stroke:var(--line)}
.dial .p{transition:stroke-dashoffset .3s linear}
.dial-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.time{font:500 40px/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.phase{font-size:13px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:6px}
.focus-for{font-size:13px;color:var(--muted);text-align:center;margin:8px 0 12px;min-height:20px;overflow-wrap:anywhere}
.focus-for b{color:var(--ink);font-weight:500}
.ctrl{display:flex;justify-content:center;gap:8px}
.note{font-size:13px;text-align:center;color:var(--ink-2);background:var(--accent-soft);border-radius:var(--r-button);padding:8px 10px;margin-top:12px}
.note:empty{display:none}

/* week + heat */
.stat{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.big{font:400 30px/1 var(--serif);font-variant-numeric:tabular-nums}.big .label{font:13px var(--sans);margin-left:4px}
.bar{height:6px;border-radius:6px;background:var(--control);overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;background:var(--sig);border-radius:6px;transition:width .5s}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.stats3 div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stats3 b{display:block;font-size:15px;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
.stats3 span{font-size:12px;color:var(--muted)}
.heat{display:grid;grid-template-rows:repeat(7,var(--cell,11px));grid-auto-flow:column;grid-auto-columns:var(--cell,11px);gap:3px;justify-content:end;margin-top:4px}
.heat i{border-radius:3px;background:var(--h0)}
.heat i.l1{background:var(--h1)}.heat i.l2{background:var(--h2)}.heat i.l3{background:var(--h3)}.heat i.l4{background:var(--h4)}
.heat i.today{box-shadow:0 0 0 1.5px var(--accent)}
.heat i.fut{background:transparent}
.legend{display:flex;align-items:center;justify-content:flex-end;gap:3px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* empty */
.empty{border:1px solid var(--line);border-radius:var(--r-panel);padding:40px 22px;text-align:center}
.empty h2{font:400 34px/1.1 var(--serif);margin:0 0 8px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:420px}

/* editor */
.sheet{position:fixed;inset:0;background:rgba(17,17,19,.45);display:none;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:20}
.sheet.show{display:flex}
.panel{width:100%;max-width:640px;background:var(--canvas);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--shadow);padding:18px}
.panel h2{font:400 28px/1.1 var(--serif);margin:0 0 14px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.in{width:100%;height:38px;padding:0 11px;border:1px solid var(--line-2);border-radius:var(--r-button);background:var(--canvas)}
textarea.in{height:auto;min-height:110px;padding:9px 11px;line-height:1.5;resize:vertical;font-size:14px}
.in:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.ed-mat{border:1px solid var(--line);border-radius:var(--r-card);padding:12px;margin-bottom:10px;background:var(--surface)}
.ed-mat .head{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.ed-mat .head b{flex:1;font-size:13px;font-weight:600;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.sep{height:1px;background:var(--line);margin:16px 0}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px}
.linkbox{display:flex;gap:6px}
.linkbox .in{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,20px);opacity:0;background:var(--button);color:var(--button-ink);padding:9px 14px;border-radius:var(--r-button);font-size:13px;transition:.25s;pointer-events:none;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* standalone timer */
body.solo .wrap{max-width:none;padding:6px}
/* lima */
.l-grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:12px}
.l-kartu{display:flex;flex-direction:column;min-width:0;padding:16px}
.l-kartu.on{background:var(--surface)}
.l-atas{display:flex;align-items:center;justify-content:space-between;gap:8px}
.l-ikon{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--canvas);color:var(--ink)}
.l-ikon svg{width:18px;height:18px}
.l-kartu.on .l-ikon{background:var(--ink);border-color:var(--ink);color:var(--canvas)}
.l-kartu h3{margin:12px 0 4px;font:400 25px/1.1 var(--serif);letter-spacing:-.01em}
.l-kartu p{margin:0 0 14px;font-size:13.5px;line-height:1.4;color:var(--ink-2);min-height:38px;flex:1}
.l-titik{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.l-titik span{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.l-titik i{display:block;width:100%;max-width:22px;aspect-ratio:1;border-radius:6px;background:var(--h1)}
.l-titik .fut i{background:var(--h0)}
.l-titik .on i{background:var(--ink)}
.l-titik .now{color:var(--ink);font-weight:600}
.l-titik .now:not(.on) i{background:var(--canvas);box-shadow:inset 0 0 0 1.5px var(--accent)}
.l-kartu .btn{width:100%}
.l-minggu{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:13px 16px}
.l-minggu-t{font-size:14px;white-space:nowrap}
.l-minggu-t b{font:400 24px/1 var(--serif);margin-right:4px;font-variant-numeric:tabular-nums}
.l-minggu .bar{flex:1;min-width:120px;margin:0}
/* lima kartu tanpa celah kosong: di HP kartu kelima selebar dua kolom, di kolom sedang 3 kartu di atas dan 2 di bawah */
.l-kartu:last-child{grid-column:1/-1}
@media (min-width:640px){.l-grid{grid-template-columns:repeat(6,minmax(0,1fr))}.l-kartu,.l-kartu:last-child{grid-column:span 2}.l-kartu:nth-child(n+4){grid-column:span 3}}
@media (min-width:1000px){.l-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.l-kartu,.l-kartu:last-child,.l-kartu:nth-child(n+4){grid-column:auto}}
@media (max-width:420px){.l-kartu{padding:13px}.l-kartu h3{font-size:22px}}
/* /lima */
/* kamus */
.km{display:grid;grid-template-columns:1fr;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--canvas);overflow:hidden}
.km-foto{position:relative;min-height:230px;background-size:cover;background-position:center 55%;background-color:#1c1c1e;display:flex;align-items:flex-end}
.km-foto::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,17,19,.3) 0%,rgba(17,17,19,.82) 100%)}
.km-foto::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--sig)}
.km-isi{position:relative;width:100%;padding:22px 24px 26px;color:#fff}
.km-isi h1{margin:8px 0 6px;font:400 clamp(30px,3.6vw,44px)/1.05 var(--serif);letter-spacing:-.01em;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.km-isi h1 em{font-style:italic}
.km-isi p{margin:0 0 14px;font-size:14.5px;color:rgba(255,255,255,.86)}
.km-cari{width:100%;max-width:460px;height:44px;padding:0 14px;border:1px solid rgba(255,255,255,.5);border-radius:var(--r-button);background:#fff;color:#1c1c1e;font-size:16px;outline:0}
.km-cari::placeholder{color:#636367}
.km-cari:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.km-kanan{display:flex;flex-direction:column;min-width:0}
.km-atas{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.km-tab{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--control)}
.km-tab button{height:30px;padding:0 12px;border:0;border-radius:8px;background:none;font-size:13px;font-weight:500;color:var(--ink-2)}
.km-tab button.on{background:var(--canvas);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.km-daftar{flex:1;height:296px;max-height:296px;overflow-y:auto;overscroll-behavior:contain}
.km-baris{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) 34px 34px;align-items:center;gap:10px;padding:7px 18px;border-bottom:1px solid var(--line);min-height:56px}
.km-baris:last-of-type{border-bottom:0}
.km-baris b{font:600 24px/1.7 "Noto Naskh Arabic","Geeza Pro","Traditional Arabic","Segoe UI",var(--sans);overflow-wrap:anywhere}
.km-baris b:lang(ar){direction:rtl;unicode-bidi:isolate;text-align:left;letter-spacing:0}
.km-baris span{font-size:14.5px;color:var(--ink-2);overflow-wrap:anywhere}
.km-baris small{display:block;font-size:12px;color:var(--muted)}
.km-tanda.on{background:var(--ink);border-color:var(--ink);color:var(--canvas)}
.km-tanda.on svg{fill:currentColor}
.km-baris b.panjang{font-size:19px;line-height:1.8}
.km-kosong{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 22px;font-size:14px;line-height:1.5;color:var(--muted);text-align:center}
.km-kosong small{font-size:12.5px}
.km-luar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 18px;background:var(--surface);font-size:13px;color:var(--muted)}
.km-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) auto;gap:8px;padding:12px 18px 14px;border-top:1px solid var(--line);background:var(--surface);position:sticky;bottom:0}

function fitHeat() {
  const h = $("#heat"); if (!h) return;
  const w = h.getBoundingClientRect().width - 2, gap = 3, maks = PAPAN ? 53 : 26;
  // kotak 11 px; kalau ruangnya lebih dari setahun, kotaknya yang dibesarkan (maks 16 px)
  let cell = 11, weeks = Math.floor((w + gap) / (cell + gap));
  if (weeks > maks) { weeks = maks; if (PAPAN) cell = Math.max(11, Math.min(16, Math.floor((w + gap) / maks) - gap)); }
  weeks = Math.max(8, weeks);
  h.style.setProperty("--cell", cell + "px");
  h.innerHTML = heatHTML(weeks);
  const r = $("#heat-range"); if (r) r.textContent = weeks + " minggu";
  const m = $("#heat-m"); if (!m) return;
  // label bulan di atas kolom tempat bulan berganti
  const end = new Date(); end.setHours(0, 0, 0, 0);
  const start = new Date(end); start.setDate(end.getDate() - (end.getDay() + 6) % 7 - (weeks - 1) * 7);
  const step = cell + gap, kiri = w + 2 - (weeks * step - gap);
  const bulan = Array.from({ length: weeks }, (_, c) => { const d = new Date(start); d.setDate(start.getDate() + c * 7); return d.getMonth(); });
  let html = "", last = -9;
  bulan.forEach((mo, c) => {
    const ganti = c === 0 ? (bulan[1] === mo && bulan[2] === mo) : mo !== bulan[c - 1];
    if (ganti && c - last >= 3 && c <= weeks - 2) { html += `<span style="left:${Math.round(kiri + c * step)}px">${BULAN[mo]}</span>`; last = c; }
  });
  m.innerHTML = html;
}

        <div class="head"><b>Materi ${i + 1}</b>
          <button class="mini" data-ed="up" data-i="${i}" ${i ? "" : "disabled"}>Naik</button>
          <button class="mini" data-ed="down" data-i="${i}" ${i < d.materi.length - 1 ? "" : "disabled"}>Turun</button>
          <button class="mini" data-ed="del" data-i="${i}">Hapus</button></div>
        <div class="cols">
          <label class="field"><span>Nama materi</span><input class="in f-nama" value="${esc(m.nama)}" placeholder="A1 Textbook"></label>
          <label class="field"><span>Link halaman Notion (opsional)</span><input class="in f-link" value="${esc(m.link)}" placeholder="https://www.notion.so/..."></label>
        </div>
        <label class="field" style="margin:0"><span>Daftar bab, satu per baris</span>
          <textarea class="in f-bab" placeholder="Unit 1 · Hello&#10;Unit 2 · My family | https://www.notion.so/...">${esc(babToText(m.bab))}</textarea></label>
        <div class="hint">Link per bab opsional: tulis setelah tanda | . Kalau kosong, bab membuka link materi.</div>
      </div>`).join("")}
    </div>
    <button class="btn" data-ed="add">+ Tambah materi</button>
    <div class="sep"></div>
    <div class="field" style="margin:0"><span class="label">Link untuk embed di Notion</span>
      <div class="linkbox" style="margin-top:5px"><input class="in" id="f-out" readonly value="${cfg ? esc(embedLink()) : "Simpan dulu, link muncul di sini."}"><button class="btn" data-ed="copy" ${cfg ? "" : "disabled"}>Salin</button></div>
      <div class="hint">Daftar materi ikut tersimpan di link ini, jadi tampil sama di laptop dan HP. Centang bab dan menit fokus tersimpan di masing-masing perangkat. Setiap kali daftar diubah, salin link baru dan ganti embed di Notion.</div>
    </div>
    <div class="foot">
      <button class="btn" data-ed="close">Batal</button>
      <button class="btn primary" data-ed="save">Simpan</button>
    </div>`;
}
$("#sheet").addEventListener("click", async e => {
  if (e.target.id === "sheet") { $("#sheet").classList.remove("show"); return; }
  const el = e.target.closest("[data-ed]"); if (!el) return;
  const a = el.dataset.ed, i = +el.dataset.i;
  if (a === "close") { $("#sheet").classList.remove("show"); return; }
  if (a === "copy") { const ok = await copyText($("#f-out").value); toast(ok ? "Link disalin" : "Salin manual: pilih teks link"); if (!ok) $("#f-out").select(); return; }
  readEditor();
  if (a === "add") draft.materi.push({ nama: "", link: "", bab: [] });
  else if (a === "del") draft.materi.splice(i, 1);
  else if (a === "up" && i > 0) [draft.materi[i - 1], draft.materi[i]] = [draft.materi[i], draft.materi[i - 1]];
  else if (a === "down" && i < draft.materi.length - 1) [draft.materi[i + 1], draft.materi[i]] = [draft.materi[i], draft.materi[i + 1]];
  else if (a === "save") {
    draft.materi = draft.materi.filter(m => m.nama || m.bab.length).map((m, k) => ({ ...m, nama: m.nama || `Materi ${k + 1}` }));
    // nama materi kembar bikin id bentrok, beri nomor
    const seen = {}; draft.materi.forEach(m => { seen[m.nama] = (seen[m.nama] || 0) + 1; if (seen[m.nama] > 1) m.nama += ` (${seen[m.nama]})`; });
    saveCfg(draft); loadProg(); render(); drawEditor();
    toast("Tersimpan. Salin link untuk Notion.");
    return;
  }
  drawEditor();
});

/* ---------- mulai ---------- */
if (cfg) loadProg();
render();
setInterval(tick, 250);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { T = Object.assign({}, T0, LS.get(TKEY, {})); checkDone(); render(); } });
})();
</script>
</body>
</html>
