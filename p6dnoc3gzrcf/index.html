<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Course Hub · Darkcrow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#ffffff;--surface:#fafafa;--control:#f4f4f4;
  --line:#e7e7e8;--line-2:#d8d8da;
  --ink:#1c1c1e;--ink-2:#3f3f43;--muted:#636367;
  --button:#232325;--button-h:#424245;--button-ink:#ffffff;
  --dark:#1c1c1e;--dark-2:#111113;--dark-line:#2e2e31;--dark-ink:#f4f4f5;--dark-muted:#8f8f94;
  --accent:#e5484d;--accent-strong:#c8372d;--accent-soft:#fdeeed;--violet:#7c5cff;
  --sig:linear-gradient(90deg,#e5484d 0%,#e5484d 55%,#7c5cff 100%);
  --h0:#efeff0;--h1:#cfcfd2;--h2:#9c9ca1;--h3:#5d5d62;--h4:#1c1c1e;
  --shadow:0 12px 28px -18px rgba(0,0,0,.24);
  --serif:"Instrument Serif",Georgia,serif;
  --sans:"Inter Variable",Inter,Arial,sans-serif;
  --r-button:10px;--r-card:14px;--r-panel:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#191919;--surface:#202022;--control:#2a2a2d;
    --line:#2e2e31;--line-2:#3a3a3e;
    --ink:#f2f2f3;--ink-2:#c9c9cd;--muted:#8f8f94;
    --button:#f2f2f3;--button-h:#d8d8db;--button-ink:#111113;
    --dark:#232325;--dark-2:#1c1c1e;--dark-line:#34343a;
    --accent-soft:rgba(229,72,77,.16);
    --h0:#262628;--h1:#3d3d41;--h2:#66666c;--h3:#a3a3a8;--h4:#f2f2f3;
    --shadow:0 12px 28px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#191919;--surface:#202022;--control:#2a2a2d;
  --line:#2e2e31;--line-2:#3a3a3e;
  --ink:#f2f2f3;--ink-2:#c9c9cd;--muted:#8f8f94;
  --button:#f2f2f3;--button-h:#d8d8db;--button-ink:#111113;
  --dark:#232325;--dark-2:#1c1c1e;--dark-line:#34343a;
  --accent-soft:rgba(229,72,77,.16);
  --h0:#262628;--h1:#3d3d41;--h2:#66666c;--h3:#a3a3a8;--h4:#f2f2f3;
  --shadow:0 12px 28px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--canvas);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 28px}

/* header */
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top h1{font:400 34px/1.05 var(--serif);margin:0;letter-spacing:-.01em;flex:1;min-width:0;overflow-wrap:anywhere}
.top h1 em{font-style:italic}
.pill{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.dot.off{background:var(--line-2)}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:var(--canvas);border-radius:var(--r-button);flex:none}
.icon-btn:hover{background:var(--control)}
.icon-btn svg{width:17px;height:17px}

/* continue */
.lanjut{position:relative;overflow:hidden;background:var(--dark);color:var(--dark-ink);border-radius:var(--r-panel);padding:20px 20px 18px;margin-bottom:16px}
.lanjut::before{content:"";position:absolute;right:-60px;top:-70px;width:240px;height:200px;background:radial-gradient(closest-side,rgba(124,92,255,.22),transparent),radial-gradient(closest-side at 30% 70%,rgba(229,72,77,.14),transparent);filter:blur(24px);pointer-events:none}
.lanjut::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);background-size:14px 14px;pointer-events:none}
.lanjut>*{position:relative;z-index:1}
.eyebrow{font-size:13px;color:var(--dark-muted);display:flex;align-items:center;gap:8px}
.lanjut h2{font:400 28px/1.15 var(--serif);margin:6px 0 2px;overflow-wrap:anywhere}
.lanjut .sub{color:var(--dark-muted);font-size:14px}
.scribble{display:block;width:72px;height:3px;border-radius:3px;background:var(--sig);margin:10px 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:var(--r-button);border:1px solid var(--line-2);background:var(--canvas);font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--control)}
.btn.primary{background:var(--button);border-color:var(--button);color:var(--button-ink)}
.btn.primary:hover{background:var(--button-h)}
.btn.sm{height:32px;padding:0 11px;font-size:13px}
.btn svg{width:15px;height:15px}
.lanjut .btn{background:transparent;border-color:var(--dark-line);color:var(--dark-ink)}
.lanjut .btn:hover{background:rgba(255,255,255,.06)}
.lanjut .btn.primary{background:#fff;border-color:#fff;color:#111113}
.lanjut .btn.primary:hover{background:#e9e9ea}

/* grid */
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:640px){.grid{grid-template-columns:minmax(0,1.4fr) minmax(250px,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{border:1px solid var(--line);border-radius:var(--r-card);background:var(--canvas)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
.card-h h3{margin:0;font-size:14px;font-weight:600}
.card-b{padding:12px 16px 16px}
.label{font-size:13px;color:var(--muted)}

/* materials */
.mat{border:1px solid var(--line);border-radius:var(--r-card);background:var(--canvas);overflow:hidden}
.mat-h{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;background:none;border:0;text-align:left}
.mat-h:hover{background:var(--surface)}
.ring{width:38px;height:38px;flex:none;position:relative}
.ring svg{width:38px;height:38px;transform:rotate(-90deg)}
.ring .t{stroke:var(--line)}
.ring .p{stroke:var(--ink);transition:stroke-dashoffset .5s cubic-bezier(.2,.7,.2,1)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.ring.full .c{color:#fff}
.ring.full .c::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--accent-strong)}
.ring.full .c span{position:relative}
.mat-name{flex:1;min-width:0}
.mat-name b{display:block;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.mat-name small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.chev{width:16px;height:16px;color:var(--muted);transition:transform .2s}
.mat.open .chev{transform:rotate(180deg)}
.bab-list{display:none;border-top:1px solid var(--line);padding:4px 0;background:var(--surface)}
.mat.open .bab-list{display:block}
.bab{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 12px;min-height:40px}
.bab.now{box-shadow:inset 2px 0 0 var(--accent)}
.chk{width:22px;height:22px;flex:none;border-radius:7px;border:1px solid var(--line-2);background:var(--canvas);display:grid;place-items:center;padding:0}
.chk svg{width:13px;height:13px;opacity:0;color:#fff}
.chk.on{background:var(--accent-strong);border-color:var(--accent-strong)}
.chk.on svg{opacity:1}
.chk.pop{animation:pop .32s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.bab-name{flex:1;min-width:0;font-size:14px;color:var(--ink);text-decoration:none;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left}
a.bab-name:hover{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.bab.done .bab-name{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(229,72,77,.55)}
.mini{height:28px;padding:0 9px;border-radius:8px;border:1px solid transparent;background:none;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;flex:none}
.mini:hover{border-color:var(--line-2);color:var(--ink);background:var(--canvas)}
.mini svg{width:13px;height:13px}
.bab-txt{flex:1;min-width:0;display:flex;flex-direction:column}.bab-txt .from{font-size:12px;color:var(--muted)}
.mini.on{color:var(--ink);border-color:var(--line-2);background:var(--canvas)}.mini.on svg{color:var(--accent-strong)}
.plan-list .bab{padding-left:16px;padding-right:12px}
.sg{list-style:none;counter-reset:s;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.sg li{counter-increment:s;display:flex;flex-direction:column;padding:8px 10px 8px 36px;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.sg li::before{content:counter(s);position:absolute;left:12px;top:9px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sg b{font-weight:500;font-size:14px}.sg small{font-size:12px;color:var(--muted)}
.stats3 b small{font-size:12px;font-weight:400;color:var(--muted)}
.mat-link{display:flex;justify-content:flex-end;padding:4px 12px 8px}

/* timer */
.tabs{display:inline-flex;background:var(--control);border-radius:var(--r-button);padding:3px;gap:2px}
.tabs button{height:28px;padding:0 11px;border:0;border-radius:8px;background:none;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--canvas);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.clock{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px}
.dial{position:relative;width:176px;height:176px}
.dial svg{width:176px;height:176px;transform:rotate(-90deg)}
.dial .t{stroke:var(--line)}
.dial .p{transition:stroke-dashoffset .3s linear}
.dial-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.time{font:500 40px/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.phase{font-size:13px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:6px}
.focus-for{font-size:13px;color:var(--muted);text-align:center;margin:8px 0 12px;min-height:20px;overflow-wrap:anywhere}
.focus-for b{color:var(--ink);font-weight:500}
.ctrl{display:flex;justify-content:center;gap:8px}
.note{font-size:13px;text-align:center;color:var(--ink-2);background:var(--accent-soft);border-radius:var(--r-button);padding:8px 10px;margin-top:12px}
.note:empty{display:none}

/* week + heat */
.stat{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.big{font:400 30px/1 var(--serif);font-variant-numeric:tabular-nums}.big .label{font:13px var(--sans);margin-left:4px}
.bar{height:6px;border-radius:6px;background:var(--control);overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;background:var(--sig);border-radius:6px;transition:width .5s}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.stats3 div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stats3 b{display:block;font-size:15px;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
.stats3 span{font-size:12px;color:var(--muted)}
.heat{display:grid;grid-template-rows:repeat(7,var(--cell,11px));grid-auto-flow:column;grid-auto-columns:var(--cell,11px);gap:3px;justify-content:end;margin-top:4px}
.heat i{border-radius:3px;background:var(--h0)}
.heat i.l1{background:var(--h1)}.heat i.l2{background:var(--h2)}.heat i.l3{background:var(--h3)}.heat i.l4{background:var(--h4)}
.heat i.today{box-shadow:0 0 0 1.5px var(--accent)}
.heat i.fut{background:transparent}
.legend{display:flex;align-items:center;justify-content:flex-end;gap:3px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* empty */
.empty{border:1px solid var(--line);border-radius:var(--r-panel);padding:40px 22px;text-align:center}
.empty h2{font:400 34px/1.1 var(--serif);margin:0 0 8px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:420px}

/* editor */
.sheet{position:fixed;inset:0;background:rgba(17,17,19,.45);display:none;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:20}
.sheet.show{display:flex}
.panel{width:100%;max-width:640px;background:var(--canvas);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--shadow);padding:18px}
.panel h2{font:400 28px/1.1 var(--serif);margin:0 0 14px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.in{width:100%;height:38px;padding:0 11px;border:1px solid var(--line-2);border-radius:var(--r-button);background:var(--canvas)}
textarea.in{height:auto;min-height:110px;padding:9px 11px;line-height:1.5;resize:vertical;font-size:14px}
.in:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.ed-mat{border:1px solid var(--line);border-radius:var(--r-card);padding:12px;margin-bottom:10px;background:var(--surface)}
.ed-mat .head{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.ed-mat .head b{flex:1;font-size:13px;font-weight:600;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.sep{height:1px;background:var(--line);margin:16px 0}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px}
.linkbox{display:flex;gap:6px}
.linkbox .in{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,20px);opacity:0;background:var(--button);color:var(--button-ink);padding:9px 14px;border-radius:var(--r-button);font-size:13px;transition:.25s;pointer-events:none;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* standalone timer */
body.solo .wrap{max-width:none;padding:6px}
/* jurnal */
body.jurnal .wrap{max-width:none;padding:6px}
body.jurnal .top{margin-bottom:12px;padding:4px 4px 0}
.j-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.j-kiri,.j-kanan{display:flex;flex-direction:column;gap:14px;min-width:0}
.j-tanya{position:relative;overflow:hidden;background:var(--dark);color:var(--dark-ink);border-radius:var(--r-panel);padding:20px 22px}
.j-tanya::before{content:"";position:absolute;right:-60px;top:-70px;width:260px;height:210px;pointer-events:none;
  background:radial-gradient(closest-side,rgba(124,92,255,.22),transparent),radial-gradient(closest-side at 30% 70%,rgba(229,72,77,.14),transparent);filter:blur(24px)}
.j-tanya::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);background-size:14px 14px;pointer-events:none}
.j-tanya>*{position:relative;z-index:1}
.j-tanya-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.j-tanya .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.j-select{height:34px;max-width:100%;padding:0 10px;border-radius:var(--r-button);border:1px solid var(--dark-line);background:rgba(255,255,255,.07);color:var(--dark-ink);font-size:13px}
.j-select option{color:#111113;background:#fff}
.j-tanya h2{font:400 clamp(26px,3vw,38px)/1.15 var(--serif);letter-spacing:-.01em;margin:14px 0 6px;overflow-wrap:anywhere}
.j-tanya p{margin:0 0 16px;font-size:14.5px;color:var(--dark-muted)}
.j-tanya .btn{background:transparent;border-color:var(--dark-line);color:var(--dark-ink)}
.j-tanya .btn:hover{background:rgba(255,255,255,.07)}
.j-chip{height:auto;min-height:32px;padding:5px 12px;display:inline-flex;align-items:baseline;gap:8px;text-align:left}
.j-chip b{font-weight:500;color:var(--ink);font-size:13.5px}
.j-chip span{font-size:12px;color:var(--muted)}
.j-pembuka{margin-top:0}
.j-tulis textarea{min-height:230px;margin-top:10px;padding:12px 14px;font-size:16px;line-height:1.6;resize:vertical}
.j-aksi{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
.j-jam .clock{padding:8px 0 2px}
.j-petunjuk{margin:12px 0 0;text-align:center}
.j-kosong{margin:2px 0}
.j-list{display:flex;flex-direction:column;margin-top:12px;border-top:1px solid var(--line)}
.j-item{border-bottom:1px solid var(--line)}
.j-item:last-child{border-bottom:0}
.j-item>button{width:100%;display:flex;align-items:center;gap:10px;padding:10px 2px;background:none;border:0;text-align:left;font-size:14px}
.j-item>button:hover{background:var(--surface)}
.j-item .tgl{min-width:50px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.j-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.j-item .kt{font-size:12px;color:var(--muted);white-space:nowrap}
.j-isi{padding:2px 2px 12px}
.j-isi p{margin:0 0 6px;font:italic 400 16px/1.3 var(--serif);color:var(--ink-2)}
.j-isi pre{margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.6 var(--sans);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:220px;overflow:auto}
@media (min-width:900px){.j-grid{grid-template-columns:minmax(0,1.75fr) minmax(290px,1fr)}}
@media (max-width:560px){.j-tanya{padding:18px}.j-chip{width:100%}}
/* /jurnal */
body.papan .wrap{max-width:none;padding:6px}
.p-hero{position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;min-height:178px;padding:22px 24px;margin-bottom:14px;
  border-radius:var(--r-panel);background-size:cover;background-position:center 58%;background-color:#1c1c1e;color:#fff}
.p-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(17,17,19,.84) 0%,rgba(17,17,19,.5) 55%,rgba(17,17,19,.58) 100%)}
.p-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--sig)}
.p-hero>*{position:relative}
.p-hero-l{min-width:0}
.p-salam{font-size:13px;color:rgba(255,255,255,.8);display:inline-flex;align-items:center;gap:7px}
.p-salam::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.p-hero h1{margin:8px 0 6px;font:400 clamp(30px,4.2vw,46px)/1.05 var(--serif);letter-spacing:-.01em;overflow-wrap:anywhere;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.p-hero h1 em{font-style:italic}
.p-hero p{margin:0;font-size:14.5px;color:rgba(255,255,255,.86)}
.p-hero-r{display:flex;align-items:center;gap:10px;flex:none}
.p-ring{position:relative;width:72px;height:72px}
.p-ring>svg{width:72px;height:72px;transform:rotate(-90deg)}
.p-ring circle{transition:stroke-dashoffset .5s cubic-bezier(.2,.7,.2,1)}
.p-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.p-ring b svg{width:26px;height:26px}
.p-streak{display:flex;flex-direction:column;justify-content:center;height:72px;padding:0 16px;border-radius:14px;background:rgba(17,17,19,.36);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.p-streak b{font:400 30px/1 var(--serif);font-variant-numeric:tabular-nums}
.p-streak span{font-size:12px;color:rgba(255,255,255,.8);white-space:nowrap}
.p-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.p-grid>.card{display:flex;flex-direction:column;min-width:0}
.p-form{display:flex;gap:8px}

<body>
<div class="wrap" id="app"></div>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const fnv = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
const rid = () => Math.random().toString(36).slice(2, 10);
const enc = o => { const b = new TextEncoder().encode(JSON.stringify(o)); let s = ""; b.forEach(x => s += String.fromCharCode(x)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const dec = s => { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; const bin = atob(s); return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)))); };
const dkey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const today = () => dkey(new Date());
const BULAN = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
const fmtMin = ms => { const m = Math.round(ms / 60000); if (m < 60) return `${m} mnt`; const h = Math.floor(m / 60), r = m % 60; return r ? `${h}j ${r}m` : `${h} jam`; };
const weekStart = () => { const d = new Date(); d.setHours(0, 0, 0, 0); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return d.getTime(); };
const inFrame = (() => { try { return window.top !== window; } catch (e) { return true; } })();
const isUrl = s => /^https?:\/\/\S+$/i.test(s) || /^notion:\/\/\S+$/i.test(s);

const I = {
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.4-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg>',
  timer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9.5 2.5h5"/></svg>'
};

/* ---------- config (struktur course) ---------- */
// Struktur disimpan di link (#c=...) supaya sama di semua perangkat. Progres per perangkat.
const babId = (matName, babName, nth) => "b" + fnv(matName + "\u0001" + babName + "#" + nth);
function withIds(cfg) {
  cfg.materi.forEach(m => {
    m.id = "m" + fnv(m.nama);
    const seen = {};
    m.bab.forEach(b => { const n = (seen[b.nama] = (seen[b.nama] || 0) + 1); b.id = babId(m.nama, b.nama, n); });
  });
  return cfg;
}
const pack = c => ({ v: 1, i: c.id, j: c.judul, t: c.target, th: c.tema, p: [c.fokus, c.istirahat],
  m: c.materi.map(m => [m.nama, m.link || "", m.bab.map(b => b.link ? [b.nama, b.link] : b.nama)]) });
const unpack = o => withIds({
  id: o.i || rid(), judul: o.j || "Course", target: +o.t || 3, tema: o.th || "auto",
  fokus: (o.p && +o.p[0]) || 25, istirahat: (o.p && +o.p[1]) || 5,
  materi: (o.m || []).map(([nama, link, bab]) => ({ nama, link, bab: (bab || []).map(b => Array.isArray(b) ? { nama: b[0], link: b[1] } : { nama: b, link: "" }) }))
});

const params = new URLSearchParams(location.search);
const SOLO = params.get("v") === "timer";
const TUTUP = params.get("v") === "tutup";
const PAPAN = params.get("v") === "papan";
const JURNAL = params.get("v") === "jurnal";
const hashStr = (location.hash.match(/c=([^&]+)/) || [])[1] || "";
const CFG_KEY = "dch:cfg:" + (hashStr ? fnv(hashStr) : "local");
let cfg = null;
(() => {
  const local = LS.get(CFG_KEY, null);
  try {
    if (local) cfg = unpack(local);
    else if (hashStr) cfg = unpack(dec(hashStr));
  } catch (e) { cfg = null; }
})();
const embedLink = () => location.origin + location.pathname + "#c=" + enc(pack(cfg));
function saveCfg(next) {
  cfg = withIds(next);
  LS.set(CFG_KEY, pack(cfg));
  if (!inFrame) { try { history.replaceState(null, "", "#c=" + enc(pack(cfg))); } catch (e) {} }
}

/* ---------- progres ---------- */
const PKEY = () => "dch:p:" + cfg.id;
let prog = { done: {}, last: null, open: {} };
const loadProg = () => { prog = Object.assign({ done: {}, last: null, open: {} }, cfg ? LS.get(PKEY(), {}) : {}); };
const saveProg = () => LS.set(PKEY(), prog);

/* log fokus global: semua widget di domain ini berbagi */
const LOG = "dch:log";
function addLog(ms) {
  if (ms < 1000) return;
  const log = LS.get(LOG, {}); const k = today();
  log[k] = (log[k] || 0) + Math.round(ms); LS.set(LOG, log);
}

/* ---------- tema ---------- */
function applyTheme() {
  const t = params.get("tema") || (cfg && cfg.tema) || "auto";
  if (t === "ikut") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = (t === "gelap" || t === "dark") ? "dark" : "light";
}

/* ---------- logika course ---------- */
const allBab = () => cfg.materi.flatMap(m => m.bab.map(b => ({ m, b })));
function nextUp() {
  const list = allBab(); if (!list.length) return null;
  const L = prog.last;
  if (L) {
    const i = list.findIndex(x => x.b.id === L.b);
    if (i >= 0) {
      if (!prog.done[list[i].b.id]) return list[i];
      const j = list.findIndex((x, k) => k > i && x.m.id === list[i].m.id && !prog.done[x.b.id]);
      if (j >= 0) return list[j];
    }
  }
  return list.find(x => !prog.done[x.b.id]) || null;
}
const linkOf = (m, b) => (b && b.link) || m.link || "";
function streak() {
  const log = LS.get(LOG, {});
  const act = new Set(Object.keys(log).filter(k => log[k] >= 60000));
  Object.values(prog.done).forEach(ts => act.add(dkey(new Date(ts))));
  const d = new Date(); let n = 0;
  if (!act.has(dkey(d))) d.setDate(d.getDate() - 1);
  while (act.has(dkey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const doneThisWeek = () => { const ws = weekStart(); return Object.values(prog.done).filter(ts => ts >= ws).length; };
function focusSum(fromTs) {
  const log = LS.get(LOG, {}); let s = 0;
  const d = new Date(fromTs); const end = today();
  for (let i = 0; i < 400; i++) { const k = dkey(d); s += log[k] || 0; if (k === end) break; d.setDate(d.getDate() + 1); }
  return s;
}

/* ---------- timer (state bersama lewat localStorage) ---------- */
const TKEY = "dch:timer";
const T0 = { mode: "pomo", phase: "fokus", run: false, at: 0, acc: 0, label: "", rounds: 0 };
let T = Object.assign({}, T0, LS.get(TKEY, {}));
const durs = () => {
  const f = (cfg && cfg.fokus) || +params.get("fokus") || 25, r = (cfg && cfg.istirahat) || +params.get("istirahat") || 5;
  return { fokus: f * 60000, istirahat: r * 60000 };
};
const elapsed = () => T.acc + (T.run ? Date.now() - T.at : 0);

}

/* ---------- editor ---------- */
function sample() {
  const unit = (n, arr) => arr.map((t, i) => ({ nama: `${n} ${i + 1} · ${t}`, link: "" }));
  return {
    id: rid(), judul: "A1 English", target: 3, tema: "auto", fokus: 25, istirahat: 5,
    materi: [
      { nama: "A1 Textbook", link: "", bab: unit("Unit", ["Hello", "My family", "Numbers", "Daily routine", "Food", "At home", "In town", "Review"]) },
      { nama: "A1 Workbook", link: "", bab: unit("Latihan", ["Hello", "My family", "Numbers", "Daily routine", "Food", "At home"]) },
      { nama: "Listening", link: "", bab: unit("Audio", ["Greetings", "Shopping", "Directions", "Phone calls"]) }
    ]
  };
}
let draft = null;
const babToText = bab => bab.map(b => b.link ? `${b.nama} | ${b.link}` : b.nama).join("\n");
function textToBab(t) {
  return t.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.lastIndexOf("|");
    if (i > 0) { const right = l.slice(i + 1).trim(); if (isUrl(right)) return { nama: l.slice(0, i).trim() || "Bab", link: right }; }
    const m = l.match(/^(.*?)\s+(https?:\/\/\S+)$/); if (m) return { nama: m[1].trim(), link: m[2] };
    return { nama: l, link: "" };
  });
}
function openEditor() {
  const base = cfg || { id: rid(), judul: "", target: 3, tema: "auto", fokus: 25, istirahat: 5, materi: [] };
  draft = JSON.parse(JSON.stringify(base));
  if (!draft.materi.length) draft.materi.push({ nama: "", link: "", bab: [] });
  drawEditor(); $("#sheet").classList.add("show");
}
function readEditor() {
  const p = $("#panel");
  draft.judul = $("#f-judul", p).value.trim() || "Course";
  draft.target = Math.max(1, Math.min(50, +$("#f-target", p).value || 3));


  draft.tema = $("#f-tema", p).value;
  draft.materi = [...p.querySelectorAll(".ed-mat")].map(el => ({
    nama: $(".f-nama", el).value.trim(), link: $(".f-link", el).value.trim(), bab: textToBab($(".f-bab", el).value)
  }));
}
function drawEditor() {
  const d = draft;
  $("#panel").innerHTML = `
    <h2>Atur <em>course</em></h2>
    <label class="field"><span>Judul</span><input class="in" id="f-judul" value="${esc(d.judul)}" placeholder="A1 English"></label>
    <div class="cols">
      <label class="field"><span>Target bab per minggu</span><input class="in" id="f-target" type="number" min="1" max="50" value="${d.target}"></label>

      <label class="field"><span>Tema</span><select class="in" id="f-tema">
        ${[["terang", "Terang"], ["gelap", "Gelap"], ["ikut", "Ikut perangkat"]].map(([v, t]) => `<option value="${v}"${(d.tema === "auto" ? "terang" : d.tema) === v ? " selected" : ""}>${t}</option>`).join("")}
      </select></label>
    </div>
    <div class="sep"></div>
    <div id="ed-list">
    ${d.materi.map((m, i) => `
      <div class="ed-mat">
        <div class="head"><b>Materi ${i + 1}</b>
          <button class="mini" data-ed="up" data-i="${i}" ${i ? "" : "disabled"}>Naik</button>
          <button class="mini" data-ed="down" data-i="${i}" ${i < d.materi.length - 1 ? "" : "disabled"}>Turun</button>
          <button class="mini" data-ed="del" data-i="${i}">Hapus</button></div>
        <div class="cols">
          <label class="field"><span>Nama materi</span><input class="in f-nama" value="${esc(m.nama)}" placeholder="A1 Textbook"></label>
          <label class="field"><span>Link halaman Notion (opsional)</span><input class="in f-link" value="${esc(m.link)}" placeholder="https://www.notion.so/..."></label>
        </div>
        <label class="field" style="margin:0"><span>Daftar bab, satu per baris</span>
          <textarea class="in f-bab" placeholder="Unit 1 · Hello&#10;Unit 2 · My family | https://www.notion.so/...">${esc(babToText(m.bab))}</textarea></label>
        <div class="hint">Link per bab opsional: tulis setelah tanda | . Kalau kosong, bab membuka link materi.</div>
      </div>`).join("")}
    </div>
    <button class="btn" data-ed="add">+ Tambah materi</button>
    <div class="sep"></div>
    <div class="field" style="margin:0"><span class="label">Link untuk embed di Notion</span>
      <div class="linkbox" style="margin-top:5px"><input class="in" id="f-out" readonly value="${cfg ? esc(embedLink()) : "Simpan dulu, link muncul di sini."}"><button class="btn" data-ed="copy" ${cfg ? "" : "disabled"}>Salin</button></div>
      <div class="hint">Daftar materi ikut tersimpan di link ini, jadi tampil sama di laptop dan HP. Centang bab dan menit fokus tersimpan di masing-masing perangkat. Setiap kali daftar diubah, salin link baru dan ganti embed di Notion.</div>
    </div>
    <div class="foot">
      <button class="btn" data-ed="close">Batal</button>
      <button class="btn primary" data-ed="save">Simpan</button>
    </div>`;
}
$("#sheet").addEventListener("click", async e => {
  if (e.target.id === "sheet") { $("#sheet").classList.remove("show"); return; }
  const el = e.target.closest("[data-ed]"); if (!el) return;
  const a = el.dataset.ed, i = +el.dataset.i;
  if (a === "close") { $("#sheet").classList.remove("show"); return; }
  if (a === "copy") { const ok = await copyText($("#f-out").value); toast(ok ? "Link disalin" : "Salin manual: pilih teks link"); if (!ok) $("#f-out").select(); return; }
  readEditor();
  if (a === "add") draft.materi.push({ nama: "", link: "", bab: [] });
  else if (a === "del") draft.materi.splice(i, 1);
  else if (a === "up" && i > 0) [draft.materi[i - 1], draft.materi[i]] = [draft.materi[i], draft.materi[i - 1]];
  else if (a === "down" && i < draft.materi.length - 1) [draft.materi[i + 1], draft.materi[i]] = [draft.materi[i], draft.materi[i + 1]];
  else if (a === "save") {
    draft.materi = draft.materi.filter(m => m.nama || m.bab.length).map((m, k) => ({ ...m, nama: m.nama || `Materi ${k + 1}` }));
    // nama materi kembar bikin id bentrok, beri nomor
    const seen = {}; draft.materi.forEach(m => { seen[m.nama] = (seen[m.nama] || 0) + 1; if (seen[m.nama] > 1) m.nama += ` (${seen[m.nama]})`; });
    saveCfg(draft); loadProg(); render(); drawEditor();
    toast("Tersimpan. Salin link untuk Notion.");
    return;
  }
  drawEditor();
});

/* ---------- mulai ---------- */
if (cfg) loadProg();
render();
setInterval(tick, 250);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { T = Object.assign({}, T0, LS.get(TKEY, {})); checkDone(); render(); } });
})();
</script>
</body>
